name: Publish to npm

# Publishing a GitHub Release is the single trigger for publishing: the
# release notes exist before anything ships, and a draft publishes nothing.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Pre-releases go to the "next" dist-tag so they don't become "latest".
      - name: Publish
        run: npm publish --provenance --access public ${{ github.event.release.prerelease && '--tag next' || '' }}
